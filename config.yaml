# Global dataset selection
global:
  data_dir: input
  case: case14

# Paired data paths (explicit)
train:
  normal_csv: input/case14/train/case14_2025-07_2025-08_clean_noisy.csv
  epochs: 40
  seed: 1337
  learning_rate: 0.0003
  grad_clip: 10000.0
  exp_name: gru_base_ep40
  device: cpu         # cpu | cuda
  ckpt: output/case14/models/gru_base_ep40/ckpt.pt

infer:
  normal_csv: input\case14\infer\case14_2025-09_clean_noisy.csv
  attacked_csv: input\case14\infer\case14_attack_noisy_2025-09.csv

# Windowing and batching
window:
  time_length: 96
  stride: 24
  batch_size: 64
  train_ratio: 0.7
  val_ratio: 0.15

# FDIA noise injection (training/validation)
noise:
  strength: 0.5
  seed: 1337

# Model hyperparameters
model:
  latent_dim: 64
  dec_hidden: "256,256"  # comma-separated or a YAML list, e.g., [256, 256]
  gru_hidden: 256
  gru_layers: 1
  beta: 0.1
  obs_init_logvar: -3.5
