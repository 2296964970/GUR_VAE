[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LGSSM-VAE"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "PyYAML"
]
authors = [{name="Research Team"}]
description = "Online LGSSM-VAE for FDIA repair"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["LGSSM_VAE*"]

[tool.pytest.ini_options]
pythonpath = ["."]
