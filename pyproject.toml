[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gru-vae"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "torch",
  "numpy",
  "pandas"
]
authors = [{name="Research Team"}]
description = "Online GRU-VAE for FDIA repair"
readme = "README.md"

[tool.setuptools]
packages = ["gru_vae"]
