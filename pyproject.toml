[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcn-vae"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "PyYAML"
]
authors = [{name="Research Team"}]
description = "Online TCN-VAE for FDIA repair"
readme = "README.md"

[tool.setuptools]
packages = ["tcn_vae"]
