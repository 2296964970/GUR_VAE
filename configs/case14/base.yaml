# Global dataset selection
global:
  case: case14

# Paired data paths (explicit)
train:
  normal_csv: input/case14/train/case14_normal_noisy_2025-07_2025-08.csv
  epochs: 60
  # Two-phase schedule
  phase1_epochs: 18   # identity pretraining (ELBO only)
  phase2_epochs: 42    # robust training (Laplace segments + anchor)
  anchor_lambda: 3.0   # anchor strength on non-attacked observed positions
  seed: 1337
  learning_rate: 0.0003
  grad_clip: 10000.0
  device: cuda         # cpu | cuda
  model_dir: output/case14/models/tcn_base_ep14
  # KL warmup fraction of epochs
  warmup_frac: 0.2

infer:
  normal_csv: input/case14/infer/case14_normal_noisy_2025-09.csv
  attacked_csv: input/case14/infer/case14_attack_noisy_2025-09.csv
  ckpt: output/case14/models/tcn_base_ep14/ckpt.pt
  # Optional default range for scripts/infer_range.py (CLI flags override)
  start: "2025-09-15 00:00"
  end: "2025-09-20 23:55"
  # Which series to run by default: normal | attacked | both
  series: both
  # Whether to save inference outputs (reconstructed series, RMSE) to files
  save_outputs: false
  # Blending controls for confidence-guided repair
  blend_k_sigma: 2.5
  blend_softness: 0.1
  # Temperature scaling for decoder sigma during blending (tau)
  blend_sigma_temperature: 1.5

# Preprocess / standardization
preprocess:
  # Clip standardized values to [-clip_k, clip_k] before masking; 0.0 disables clipping
  clip_k: 3.0
  # Floor for robust std when computing slot-wise stats to avoid division by near-zero
  std_floor: 0.005

# Windowing and batching
window:
  time_length: 96
  stride: 24
  batch_size: 64
  train_ratio: 0.7
  val_ratio: 0.15
  num_workers: 0

# Robust training controls (Phase-2 only)
robust:
  # Keep this fraction of batch windows completely clean (no synthetic attack)
  clean_fraction: 0.4
  # Single attacked segment length (min,max) in timesteps within a window
  seg_len: [8, 96]
  # Attack a fraction (min,max) of feature dimensions during the segment
  dims_fraction: [0.05, 0.30]
  # Laplace scale choices b for heavy-tailed offsets (standardized domain)
  laplace_scales: [0.1, 0.3, 0.7, 1.2]

# Model hyperparameters
model:
  latent_dim: 64
  dec_hidden: "256,256"  # comma-separated or a YAML list, e.g., [256, 256]
  tcn_channels: "256,256,256,256,256"  # 5 layers: receptive field ~125 steps
  tcn_kernel_size: 3
  tcn_dropout: 0.0
  beta: 0.5
  obs_init_logvar: -3.5
  encoder:
    # Positive diagonal stabilizer for Cholesky factors from encoder
    diag_eps: 0.0001
  decoder:
    # Numerical epsilon for softplus/log operations
    eps: 1.0e-6
    # Clamp bounds on decoded log-variance
    logvar_min: -5.0
    logvar_max: 2.302585092994046
  prior:
    rank: 4
    a_init: 0.95
    q_init: 0.1
    m0_init: 0.0
    P0_init: 1.0
    jitter: 1.0e-6
    variance_floor: 1.0e-6
